name: Release completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: release-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  release-completion:
    name: Release completion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch pull request commits
        if: github.event_name == 'pull_request_target'
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - name: Verify VERSION and release completion
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          jq '.pull_request.labels' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/labels.json"
          if prepared_json="$(python3 .github/scripts/release_chain.py verify-prepared --commit "${HEAD_SHA}" 2>/dev/null)"; then
            source_sha="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
            gh api "repos/${GITHUB_REPOSITORY}/commits/${source_sha}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/source-checks.json"
          else
            printf '%s\n' '{"check_runs":[]}' > "${RUNNER_TEMP}/source-checks.json"
          fi
          python3 .github/scripts/release_completion.py \
            --commit "${HEAD_SHA}" \
            --base "${BASE_SHA}" \
            --labels-json "${RUNNER_TEMP}/labels.json" \
            --checks-json "${RUNNER_TEMP}/source-checks.json" \
            --allow-migration
