name: Label Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: label-gate-${{ github.event.pull_request.number }}
  queue: max

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-labels:
    name: Validate PR labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}

      - name: Fetch current pull request labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels' > "${RUNNER_TEMP}/labels.json"

      - name: Validate PR labels
        env:
          LABELS_JSON: ${{ runner.temp }}/labels.json
        run: bash .github/scripts/label-gate.sh

      - name: Record validated release intent
        env:
          LABELS_JSON: ${{ runner.temp }}/labels.json
        run: |
          set -euo pipefail
          type_label="$(jq -r '.[] | .name | select(startswith("type:"))' "${LABELS_JSON}")"
          channel_label="$(jq -r '.[] | .name | select(startswith("channel:"))' "${LABELS_JSON}")"
          components="$(jq -r '[.[] | .name | select(startswith("component:"))] | join(",")' "${LABELS_JSON}")"
          {
            echo "### Release intent"
            echo "- type: ${type_label}"
            echo "- channel: ${channel_label}"
            echo "- components: ${components:-none}"
            echo "- source: frozen PR head ${{ github.event.pull_request.head.sha }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # The preparation workflow reads this successful gate and copies the
      # validated labels into the immutable VERSION-only commit.  Keeping this
      # workflow read-only avoids depending on issue-comment write access.
