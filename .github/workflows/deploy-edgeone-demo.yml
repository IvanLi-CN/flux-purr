name: Deploy Public Demo to EdgeOne

on:
  workflow_run:
    workflows: [CI Main]
    types: [completed]
    branches: [main]

concurrency:
  group: edgeone-demo-production
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: EdgeOne public demo deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_DEMO_PROJECT_NAME: ${{ secrets.EDGEONE_DEMO_PROJECT_NAME }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download verified public demo bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: web-demo-bundle
          path: ${{ runner.temp }}/flux-purr-demo-dist

      - name: Deploy public demo bundle
        run: |
          test -n "$EDGEONE_API_TOKEN"
          test -n "$EDGEONE_DEMO_PROJECT_NAME"
          npx --yes edgeone@1.6.18 makers deploy "$RUNNER_TEMP/flux-purr-demo-dist" -n "$EDGEONE_DEMO_PROJECT_NAME" -e production -t "$EDGEONE_API_TOKEN"
