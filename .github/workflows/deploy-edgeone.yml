name: Deploy Web to EdgeOne

on:
  workflow_run:
    workflows: [CI Main]
    types: [completed]
    branches: [main]

concurrency:
  group: edgeone-web-production
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: EdgeOne web deploy
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download verified web bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: web-production-bundle
          path: web-dist

      - name: Deploy production bundle
        run: |
          test -n "$EDGEONE_API_TOKEN"
          test -n "$EDGEONE_PROJECT_NAME"
          npx --yes edgeone@1.6.18 makers deploy web-dist -n "$EDGEONE_PROJECT_NAME" -e production -t "$EDGEONE_API_TOKEN"
