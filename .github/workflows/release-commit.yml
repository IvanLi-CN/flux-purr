name: Release Commit validation

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-commit:
    name: Release Commit validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Release Commit structure
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != VERSION ]; then
            echo "VERSION changed as part of a source or migration commit; full CI owns it"
            exit 0
          fi
          python3 .github/scripts/release_chain.py verify-commit --commit "${GITHUB_SHA}"
