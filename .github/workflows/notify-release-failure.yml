name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release Product
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release_context:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    name: Collect release context
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.context.outputs.summary }}
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect manual release identity
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          release_tag="$(git tag --points-at "${MERGE_SHA}" --list 'v*' | head -n1 || true)"
          if [ -n "${release_tag}" ]; then
            version="${release_tag#v}"
            reservation_id="${release_tag}@${MERGE_SHA}"
            recovery_target="same-identity: ${release_tag}@${MERGE_SHA}"
            recovery_hint="dispatch Release Product with operation=recover and the original release_target matching ${release_tag}"
          else
            version="$(git show "${MERGE_SHA}:VERSION" 2>/dev/null || printf '%s' unknown)"
            reservation_id="unreserved@${MERGE_SHA}"
            recovery_target="none: no immutable tag reservation was observed"
            recovery_hint="do not use recover until a release tag is bound to this exact main SHA"
          fi
          artifact_names="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[].name] | join(",")' 2>/dev/null || printf '%s' unknown)"
          details="merge_sha=${MERGE_SHA}; version=${version}; release_tag=${release_tag:-unknown}; reservation_id=${reservation_id}; artifact_names=${artifact_names}; recovery_target=${recovery_target}; recovery_hint=${recovery_hint}"
          summary="title=Release Product failure; project=${REPOSITORY}; status=${CONCLUSION}; target_sha=${MERGE_SHA}; run_url=${RUN_URL}; ${details}"
          {
            echo 'summary<<EOF'
            printf '%s\n' "${summary}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    needs: release_context
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: ${{ github.event.workflow_run.conclusion }}
      summary: ${{ needs.release_context.outputs.summary }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: "title=Release failure notification smoke; project=${{ github.repository }}; status=failure; target_sha=${{ github.sha }}; run_url=${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}; manual release identity notification smoke test; recovery_target=operator review required"
