name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release Product
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  release_context:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    name: Collect release context
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.context.outputs.summary }}
    steps:
      - name: Checkout trusted release helpers
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: main
          fetch-depth: 0

      - name: Collect manual release identity
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${MERGE_SHA}"
          release_tag=""
          version="unknown"
          release_intent="unknown"
          reservation_id="unreserved@${source_sha}"
          recovery_target="none: no immutable tag reservation was observed"
          recovery_hint="do not use recover until a canonical release tag and durable intent are bound to the release source"
          if git rev-parse --show-toplevel >/dev/null 2>&1; then
            if git fetch --force --tags origin; then
              identity_dir="${RUNNER_TEMP}/release-identity"
              rm -rf "${identity_dir}"
              if gh run download "${RUN_ID}" --repo "${REPOSITORY}" --name release-identity --dir "${identity_dir}" >/dev/null 2>&1; then
                identity_path="$(find "${identity_dir}" -type f -name release-identity.json -print -quit)"
                if [ -n "${identity_path}" ]; then
                  mapfile -t identity_values < <(python3 - "${identity_path}" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          for key in (
              "dispatchSha",
              "sourceSha",
              "trustedBaselineTag",
              "trustedBaselineVersion",
              "version",
              "tag",
              "releaseIntent",
              "operation",
              "reservationId",
          ):
              value = payload.get(key, "")
              print(value if isinstance(value, str) else "")
          PY
                  )
                  if [ "${#identity_values[@]}" = 9 ] && [ "${identity_values[0]}" = "${MERGE_SHA}" ] \
                    && [[ "${identity_values[1]}" =~ ^[0-9a-f]{40}$ ]] \
                    && [[ "${identity_values[5]}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] \
                    && [[ "${identity_values[6]}" =~ ^(patch|minor|major|rc)$ ]] \
                    && [ "${identity_values[8]}" = "${identity_values[5]}@${identity_values[1]}" ]; then
                    source_sha="${identity_values[1]}"
                    release_tag="${identity_values[5]}"
                    version="${identity_values[4]}"
                    release_intent="${identity_values[6]}"
                    reservation_id="${identity_values[8]}"
                  fi
                fi
              fi
              if [ -z "${release_tag}" ]; then
                source_sha="${MERGE_SHA}"
                canonical_tags="$(git tag --points-at "${source_sha}" --list 'v*' | python3 -c 'import re,sys; print("\n".join(tag for tag in sys.stdin.read().splitlines() if re.fullmatch(r"v\d+\.\d+\.\d+(?:-rc\.\d+)?", tag)))')"
                canonical_count="$(printf '%s\n' "${canonical_tags}" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
                if [ "${canonical_count}" = 1 ]; then
                  release_tag="${canonical_tags}"
                  version="${release_tag#v}"
                  reservation_id="${release_tag}@${source_sha}"
                elif [ "${canonical_count}" -gt 1 ]; then
                  recovery_target="ambiguous: multiple canonical release tags point to ${source_sha}"
                  recovery_hint="operator review required; do not use recover until the tag identity is unambiguous"
                fi
              fi
            else
              recovery_target="unknown: tag inventory fetch failed"
              recovery_hint="operator review required; retry metadata collection before selecting recovery"
            fi
          fi
          if [ -n "${release_tag}" ]; then
            if ! git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null 2>&1 \
              || [ "$(git rev-list -n1 "${release_tag}")" != "${source_sha}" ]; then
              recovery_target="unrecoverable: ${release_tag} does not point to recorded source ${source_sha}"
              recovery_hint="operator review required; do not use recover until the release tag and source identity agree"
            else
              tag_subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/${release_tag}" | head -n1 || true)"
              tag_intent="$(printf '%s\n' "${tag_subject}" | sed -n 's/^Flux-Purr-Release-Intent: \([^;]*\);.*$/\1/p')"
              tag_baseline="$(printf '%s\n' "${tag_subject}" | sed -n 's/.*Flux-Purr-Trusted-Baseline: \([^;]*\);.*$/\1/p')"
              tag_reservation="$(printf '%s\n' "${tag_subject}" | sed -n 's/.*Flux-Purr-Reservation-ID: \([^;]*\)$/\1/p')"
              if [ -n "${tag_intent}" ] && [ -n "${tag_baseline}" ] && [ "${tag_reservation}" = "${release_tag}@${source_sha}" ]; then
                release_intent="${tag_intent}"
                reservation_id="${release_tag}@${source_sha}"
                recovery_target="same-identity: ${release_tag}@${source_sha}"
                recovery_hint="dispatch Release Product from main with operation=recover, release_target=${tag_intent}, and recovery_tag=${release_tag}"
              else
                recovery_target="unrecoverable: ${release_tag} has no durable release intent metadata"
                recovery_hint="do not use recover until the release identity metadata is restored or operator review authorizes a new boundary"
              fi
            fi
          elif git rev-parse --show-toplevel >/dev/null 2>&1; then
            version="$(git show "${MERGE_SHA}:VERSION" 2>/dev/null || printf '%s' unknown)"
          fi
          artifact_names="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[].name] | join(",")' 2>/dev/null || printf '%s' unknown)"
          details="merge_sha=${MERGE_SHA}; source_sha=${source_sha}; version=${version}; release_tag=${release_tag:-unknown}; release_intent=${release_intent}; reservation_id=${reservation_id}; artifact_names=${artifact_names}; recovery_target=${recovery_target}; recovery_hint=${recovery_hint}"
          summary="title=Release Product failure; project=${REPOSITORY}; status=${CONCLUSION}; target_sha=${MERGE_SHA}; run_url=${RUN_URL}; ${details}"
          {
            echo 'summary<<EOF'
            printf '%s\n' "${summary}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

  notify_failure:
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    needs: release_context
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: ${{ github.event.workflow_run.conclusion }}
      summary: ${{ needs.release_context.outputs.summary || format('title=Release Product failure; project={0}; status=failure; target_sha={1}; run_url={2}; recovery_target=operator review required', github.repository, github.event.workflow_run.head_sha, github.event.workflow_run.html_url) }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: "title=Release failure notification smoke; project=${{ github.repository }}; status=failure; target_sha=${{ github.sha }}; run_url=${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}; manual release identity notification smoke test; recovery_target=operator review required"
