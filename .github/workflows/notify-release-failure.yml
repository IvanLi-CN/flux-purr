name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release Product
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  release_context:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    name: Collect release context
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.context.outputs.summary }}
    steps:
      - name: Checkout release metadata helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect immutable release context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh api "repos/${REPOSITORY}/commits/${MERGE_SHA}/pulls" --jq '.[0].number // "unknown"' 2>/dev/null || printf '%s' unknown)"
          labels="unknown"
          if [ "${pr_number}" != unknown ]; then
            labels="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" --jq '[.labels[].name] | join(",")' 2>/dev/null || printf '%s' unknown)"
          fi
          type_label="$(printf '%s' "${labels}" | tr ',' '\n' | grep '^type:' | head -n1 || true)"
          channel_label="$(printf '%s' "${labels}" | tr ',' '\n' | grep '^channel:' | head -n1 || true)"
          components="$(printf '%s' "${labels}" | tr ',' '\n' | grep '^component:' | paste -sd, - || true)"
          artifact_names="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[].name] | join(",")' 2>/dev/null || printf '%s' unknown)"
          candidate_version="$(git show "${MERGE_SHA}:VERSION" 2>/dev/null || printf '%s' unknown)"
          details="pr_number=${pr_number}; merge_commit_sha=${MERGE_SHA}; type_label=${type_label:-unknown}; channel_label=${channel_label:-unknown}; components=${components:-none}; selected_version=${candidate_version}; artifact_names=${artifact_names}; backfill=dispatch Release Product with operation=recover and commit_sha=${MERGE_SHA}"
          summary="title=Release Product failure; project=${REPOSITORY}; status=${CONCLUSION}; target_sha=${MERGE_SHA}; run_url=${RUN_URL}; ${details}"
          {
            echo 'summary<<EOF'
            printf '%s\n' "${summary}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    needs: release_context
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: ${{ github.event.workflow_run.conclusion }}
      summary: ${{ needs.release_context.outputs.summary }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: "title=Release failure notification smoke; project=${{ github.repository }}; status=failure; target_sha=${{ github.sha }}; run_url=${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}; manual notifier smoke test; backfill=dispatch Release Product recover"
