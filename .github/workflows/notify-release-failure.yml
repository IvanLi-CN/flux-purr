name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release Product
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    uses: IvanLi-CN/github-workflows/.github/workflows/release-failure-telegram.yml@main
    with:
      repository: ${{ github.repository }}
      workflow_name: ${{ github.event.workflow_run.name }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
      run_url: ${{ github.event.workflow_run.html_url }}
      ref_label: "${{ format('branch: {0}', github.event.workflow_run.head_branch || 'unknown') }}"
      head_sha: ${{ github.event.workflow_run.head_sha }}
      run_attempt: ${{ github.event.workflow_run.run_attempt }}
      actor: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login || github.actor }}
      event_name: ${{ github.event.workflow_run.event }}
      extra_details: >-
        release intent context: pr_number=${{ github.event.workflow_run.pull_requests[0].number || 'unknown' }};
        merge_commit_sha=${{ github.event.workflow_run.head_sha }};
        type_label=read-from-refs/notes/release-snapshots;
        channel_label=read-from-refs/notes/release-snapshots;
        components=read-from-release-manifest;
        selected_version=read-from-Release-Commit-VERSION;
        artifact_names=read-from-release-run;
        backfill=dispatch Release Product with operation=recover and commit_sha=${{ github.event.workflow_run.head_sha }}
    secrets:
      SHOUTRRR_URL: ${{ secrets.SHOUTRRR_URL }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: IvanLi-CN/github-workflows/.github/workflows/release-failure-telegram.yml@main
    with:
      alert_kind: "release-alert-smoke"
      repository: ${{ github.repository }}
      workflow_name: "Notify failed release"
      conclusion: "failure"
      run_url: "${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}"
      ref_label: "${{ format('branch: {0}', github.ref_name) }}"
      head_sha: ${{ github.sha }}
      run_attempt: ${{ github.run_attempt }}
      actor: ${{ github.actor }}
      event_name: "workflow_dispatch"
      extra_details: "manual notifier smoke test; backfill=dispatch Release Product recover"
    secrets:
      SHOUTRRR_URL: ${{ secrets.SHOUTRRR_URL }}
