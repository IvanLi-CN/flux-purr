name: Prepare product version

on:
  workflow_run:
    workflows: [CI PR, Label Gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open in-repository product PR to prepare"
        required: true
        type: string
      operation:
        description: "Preparation operation"
        required: true
        type: choice
        options: [automatic, exact]
        default: automatic
      exact_version:
        description: "Exact VERSION for major, minor, or RC intent"
        required: false
        type: string

concurrency:
  group: prepare-product-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  prepare:
    name: Prepare product version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Configure release preparation identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve current pull request source
        id: pr
        env:
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_PR: ${{ inputs.pr_number || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_PR}" ]; then
            pr_number="${DISPATCH_PR}"
          else
            pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "${EVENT_PATH}")"
          fi
          test -n "${pr_number}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pull-request.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request.json")" = open
          test "$(jq -r '.base.ref' "${RUNNER_TEMP}/pull-request.json")" = main
          test "$(jq -r '.head.repo.full_name // empty' "${RUNNER_TEMP}/pull-request.json")" = "${GITHUB_REPOSITORY}"
          source_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
          head_ref="$(jq -r '.head.ref' "${RUNNER_TEMP}/pull-request.json")"
          git check-ref-format --branch "${head_ref}" >/dev/null
          jq '.labels' "${RUNNER_TEMP}/pull-request.json" > "${RUNNER_TEMP}/labels.json"
          git fetch --no-tags origin "${source_sha}" "${base_sha}"
          git worktree add --detach "${RUNNER_TEMP}/release-source" "${source_sha}"
          verification_sha="${source_sha}"
          if prepared_json="$(python3 .github/scripts/release_chain.py verify-prepared --commit "${source_sha}" 2>/dev/null)"; then
            verification_sha="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${verification_sha}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/check-runs.json"
          {
            echo "number=${pr_number}"
            echo "source_sha=${source_sha}"
            echo "verification_sha=${verification_sha}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare immutable VERSION commit
        id: prepare
        env:
          PREPARE_OPERATION: ${{ inputs.operation || 'automatic' }}
          EXACT_VERSION: ${{ inputs.exact_version || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo-root "${RUNNER_TEMP}/release-source"
            --source-sha "${{ steps.pr.outputs.source_sha }}"
            --base-sha "${{ steps.pr.outputs.base_sha }}"
            --labels-json "${RUNNER_TEMP}/labels.json"
            --checks-json "${RUNNER_TEMP}/check-runs.json"
            --mode "${PREPARE_OPERATION}"
            --github-output "${GITHUB_OUTPUT}"
          )
          if [ -n "${EXACT_VERSION}" ]; then
            args+=(--exact-version "${EXACT_VERSION}")
          fi
          python3 .github/scripts/release_preparation.py "${args[@]}"

      - name: Sign prepared VERSION commit
        if: steps.prepare.outputs.prepared == 'created'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_GPG_PRIVATE_KEY}"
          export GNUPGHOME="${RUNNER_TEMP}/release-gpg"
          mkdir -p "${GNUPGHOME}"
          chmod 700 "${GNUPGHOME}"
          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import
          signing_key="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          signing_uid="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "uid" { print $10; exit }')"
          signing_email="$(printf '%s' "${signing_uid}" | sed -n 's/.*<\([^>]*\)>.*/\1/p')"
          signing_name="$(printf '%s' "${signing_uid}" | sed 's/ <.*//')"
          test -n "${signing_key}"
          test -n "${signing_email}"
          test -n "${signing_name}"
          gpg_wrapper="${RUNNER_TEMP}/release-gpg-wrapper"
          cat > "${gpg_wrapper}" <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" "$@"
          EOF
          chmod 700 "${gpg_wrapper}"
          source_root="${RUNNER_TEMP}/release-source"
          git -C "${source_root}" config user.name "${signing_name}"
          git -C "${source_root}" config user.email "${signing_email}"
          git -C "${source_root}" config user.signingkey "${signing_key}"
          git -C "${source_root}" config gpg.program "${gpg_wrapper}"
          git -C "${source_root}" commit --amend --no-edit -S --reset-author
          git -C "${source_root}" verify-commit HEAD

      - name: Push prepared VERSION commit to the existing pull request
        if: steps.prepare.outputs.prepared == 'created'
        env:
          SOURCE_SHA: ${{ steps.pr.outputs.source_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')" = "${SOURCE_SHA}"
          prepared_sha="$(git -C "${RUNNER_TEMP}/release-source" rev-parse HEAD)"
          test "$(git -C "${RUNNER_TEMP}/release-source" show -s --format=%P "${prepared_sha}")" = "${SOURCE_SHA}"
          git -C "${RUNNER_TEMP}/release-source" push origin "${prepared_sha}:refs/heads/${HEAD_REF}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${prepared_sha}" --jq '.commit.verification.verified')" = true
