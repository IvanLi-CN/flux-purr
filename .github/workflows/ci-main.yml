name: CI Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Release preparation validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout commit and parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify and validate main commit
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          parents="$(git show -s --format=%P "${GITHUB_SHA}")"
          if [ "$(wc -w <<<"${parents}")" -eq 2 ] && git diff --quiet "${GITHUB_SHA}" "${GITHUB_SHA}^2"; then
            if python3 .github/scripts/release_chain.py verify-prepared --commit "${GITHUB_SHA}^2"; then
              echo "kind=prepared-integration" >> "$GITHUB_OUTPUT"
            else
              echo "kind=pr-integration" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=source" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: Firmware checks
    needs: classify
    if: needs.classify.outputs.kind == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Firmware fmt
        run: bash scripts/check-firmware-fmt.sh

      - name: Firmware clippy
        run: bash scripts/check-firmware-clippy.sh

      - name: Setup Xtensa toolchain
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: Firmware build
        run: bash scripts/check-firmware-build.sh

  devd:
    name: DEVD checks
    needs: classify
    if: needs.classify.outputs.kind == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: DEVD tests
        run: bash scripts/check-devd.sh

  web:
    name: Web checks
    needs: classify
    if: needs.classify.outputs.kind == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install web dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Install Playwright browsers
        run: cd web && bunx playwright install --with-deps chromium

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: Quality gates declaration
        run: python3 .github/scripts/check-quality-gates.py

      - name: Release policy script tests
        run: |
          python3 -m py_compile .github/scripts/release_chain.py .github/scripts/release_preparation.py .github/scripts/release_completion.py .github/scripts/release_snapshot.py .github/scripts/product_release_manifest.py .github/scripts/check-quality-gates.py tools/firmware-web-catalog/build_catalog.py
          python3 scripts/test-product-version.py
          bash scripts/test-build-identities.sh
          bash .github/scripts/test-release-chain.sh
          bash .github/scripts/test-release-preparation.sh
          bash .github/scripts/test-release-completion.sh
          bash .github/scripts/test-release-labels.sh
          python3 -m unittest tools/firmware-web-catalog/test_build_catalog.py

      - name: Biome check + typecheck
        run: bash scripts/check-web-check.sh

      - name: Web unit tests
        run: bun run --cwd web test:unit

      - name: Web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/firmware-web-catalog/build_catalog.py --output-root web/public/firmware
          bash scripts/check-web-build.sh

      - name: Storybook build
        run: bash scripts/check-storybook-build.sh

      - name: Storybook interaction tests
        run: bun run --cwd web test:storybook

      - name: E2E tests
        run: bash scripts/check-web-e2e.sh

  worktree-bootstrap:
    name: Worktree bootstrap
    needs: classify
    if: needs.classify.outputs.kind == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Worktree bootstrap smoke
        run: bun run test:worktree-bootstrap
