name: CI Main

on:
  push:
    branches: [main]
    paths-ignore:
      - VERSION
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: Firmware checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Firmware fmt
        run: bash scripts/check-firmware-fmt.sh

      - name: Firmware clippy
        run: bash scripts/check-firmware-clippy.sh

      - name: Setup Xtensa toolchain
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: Firmware build
        run: bash scripts/check-firmware-build.sh

  devd:
    name: DEVD checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: DEVD tests
        run: bash scripts/check-devd.sh

  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install web dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Install Playwright browsers
        run: cd web && bunx playwright install --with-deps chromium

      - name: Quality gates declaration
        run: python3 .github/scripts/check-quality-gates.py

      - name: Release policy script tests
        run: |
          python3 -m py_compile .github/scripts/release_chain.py .github/scripts/release_completion.py .github/scripts/release_snapshot.py .github/scripts/product_release_manifest.py .github/scripts/check-quality-gates.py tools/firmware-web-catalog/build_catalog.py
          python3 scripts/test-product-version.py
          bash scripts/test-build-identities.sh
          bash .github/scripts/test-release-chain.sh
          bash .github/scripts/test-release-labels.sh
          python3 -m unittest tools/firmware-web-catalog/test_build_catalog.py

      - name: Biome check + typecheck
        run: bash scripts/check-web-check.sh

      - name: Web unit tests
        run: bun run --cwd web test:unit

      - name: Web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/firmware-web-catalog/build_catalog.py --output-root web/public/firmware
          bash scripts/check-web-build.sh

      - name: Storybook build
        run: bash scripts/check-storybook-build.sh

      - name: Storybook interaction tests
        run: bun run --cwd web test:storybook

      - name: E2E tests
        run: bash scripts/check-web-e2e.sh

      - name: Upload verified web bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-production-bundle
          path: web/dist
          if-no-files-found: error

      - name: Upload verified public demo bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-demo-bundle
          path: web/dist-demo
          if-no-files-found: error

  worktree-bootstrap:
    name: Worktree bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Worktree bootstrap smoke
        run: bun run test:worktree-bootstrap
