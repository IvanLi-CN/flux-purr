name: CI Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  classify:
    name: Release source validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout commit and parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source boundary
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          echo "kind=source" >> "$GITHUB_OUTPUT"

  firmware:
    name: Firmware checks
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail closed when source validation fails
        if: needs.classify.result != 'success' || needs.classify.outputs.kind != 'source'
        run: |
          echo "release source validation did not produce a trusted source classification" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Firmware fmt
        run: bash scripts/check-firmware-fmt.sh

      - name: Rust style boundaries
        run: bash scripts/check-rust-style.sh

      - name: Firmware clippy
        run: bash scripts/check-firmware-clippy.sh

      - name: Product firmware tests
        run: cargo test --locked --manifest-path firmware/Cargo.toml --all-targets

      - name: RAM bring-up protocol tests
        run: cargo test --locked -p flux-purr-ram-bringup --all-targets

      - name: PD HIL firmware protocol tests
        run: cargo test --locked --manifest-path firmware/ram-pd-hil/Cargo.toml

      - name: PD sink core and fan-pd protocol tests
        run: cargo test --locked --manifest-path firmware/pd-sink-core/Cargo.toml && cargo test --locked --manifest-path firmware/ram-fan-pd/Cargo.toml

      - name: Setup Xtensa toolchain
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: RAM bring-up ELF build
        run: bash scripts/build-ram-bringup.sh

      - name: PD HIL RAM ELF build and safety gate
        run: bash scripts/build-ram-pd-hil.sh

      - name: Fan PD RAM ELF build and safety gate
        run: bash scripts/build-ram-fan-pd.sh

      - name: RAM ELF safety checker
        run: python3 firmware/ram-bringup/tools/check_ram_elf.py firmware/ram-bringup/target/xtensa-esp32s3-none-elf/release/flux-purr-ram-bringup --json

      - name: RAM ELF checker tests
        run: python3 -m unittest discover -s firmware/ram-bringup/tools -p 'test_*.py'

      - name: Firmware Xtensa clippy
        run: bash scripts/check-firmware-clippy-xtensa.sh

      - name: Firmware build
        run: bash scripts/check-firmware-build.sh

  devd:
    name: DEVD checks
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed when source validation fails
        if: needs.classify.result != 'success' || needs.classify.outputs.kind != 'source'
        run: |
          echo "release source validation did not produce a trusted source classification" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: DEVD tests
        run: bash scripts/check-devd.sh

  devd-windows:
    name: DEVD Windows checks
    needs: classify
    if: always()
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed when source validation fails
        if: needs.classify.result != 'success' || needs.classify.outputs.kind != 'source'
        shell: bash
        run: |
          echo "release source validation did not produce a trusted source classification" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: DEVD Windows tests
        run: cargo test --locked --manifest-path tools/flux-purr-devd/Cargo.toml

  web:
    name: Web checks
    needs: classify
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fail closed when source validation fails
        if: needs.classify.result != 'success' || needs.classify.outputs.kind != 'source'
        run: |
          echo "release source validation did not produce a trusted source classification" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install web dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Install Playwright browsers
        run: cd web && bunx playwright install --with-deps chromium

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: GitHub Actions lint
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "${RUNNER_TEMP}/bin/actionlint"

      - name: Quality gates declaration
        run: python3 .github/scripts/check-quality-gates.py

      - name: Release policy script tests
        run: |
          python3 -m py_compile .github/scripts/manual_release.py .github/scripts/product_release_manifest.py .github/scripts/check-quality-gates.py tools/firmware-web-catalog/build_catalog.py
          python3 scripts/test-product-version.py
          bash scripts/test-build-identities.sh
          bash .github/scripts/test-manual-release.sh
          bash .github/scripts/test-release-workflows.sh
          python3 -m unittest tools/firmware-web-catalog/test_build_catalog.py

      - name: Biome check + typecheck
        run: bash scripts/check-web-check.sh

      - name: Web unit tests
        run: bun run --cwd web test:unit

      - name: Web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/firmware-web-catalog/build_catalog.py --output-root web/public/firmware
          bash scripts/check-web-build.sh

      - name: Storybook build
        run: bash scripts/check-storybook-build.sh

      - name: Storybook interaction tests
        run: bun run --cwd web test:storybook

      - name: E2E tests
        run: bash scripts/check-web-e2e.sh

  worktree-bootstrap:
    name: Worktree bootstrap
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fail closed when source validation fails
        if: needs.classify.result != 'success' || needs.classify.outputs.kind != 'source'
        run: |
          echo "release source validation did not produce a trusted source classification" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Worktree bootstrap smoke
        run: bun run test:worktree-bootstrap
