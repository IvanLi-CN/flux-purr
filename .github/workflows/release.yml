name: Release Product

on:
  workflow_run:
    workflows: [CI Main]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation"
        required: true
        type: choice
        options: [recover, exact, promote]
        default: recover
      commit_sha:
        description: "Source SHA for exact/automatic, or Release Commit SHA for recover/promote"
        required: true
        type: string
      exact_version:
        description: "Exact VERSION for major, minor or RC release"
        required: false
        type: string

concurrency:
  group: release-product-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    name: Release Product
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Create release controller token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: false

      - name: Configure release controller identity
        env:
          APP_SLUG: ${{ steps.release-app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve or reuse staged Release Commit
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          SOURCE_INPUT: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
          DISPATCH_OPERATION: ${{ inputs.operation || 'automatic' }}
          EXACT_VERSION: ${{ inputs.exact_version || '' }}
          READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = workflow_run ]; then
            test "${WORKFLOW_CONCLUSION}" = success
            test "${WORKFLOW_EVENT}" = push
            operation=automatic
          else
            operation="${DISPATCH_OPERATION}"
          fi
          case "${operation}" in automatic|exact|recover|promote) ;; *) echo "unsupported operation: ${operation}" >&2; exit 1 ;; esac
          git fetch --force origin main --tags
          main_sha="$(git rev-parse origin/main)"

          if [ "${operation}" = automatic ] && python3 .github/scripts/release_chain.py verify-commit --commit "${SOURCE_INPUT}" >/dev/null 2>&1; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "release_reason=release_commit" >> "$GITHUB_OUTPUT"
            echo "Release Commit ${SOURCE_INPUT} is structural-only; product release is skipped"
            exit 0
          fi

          enabled=true
          if [ "${operation}" = automatic ] || [ "${operation}" = exact ]; then
            test -n "${SOURCE_INPUT}"
            intent_file="$(mktemp)"
            trap 'rm -f "${intent_file}"' EXIT
            python3 .github/scripts/release_snapshot.py ensure \
              --target-sha "${SOURCE_INPUT}" \
              --github-repository "${GITHUB_REPOSITORY}" \
              --github-token "${READ_TOKEN}" \
              --output "${intent_file}"
            python3 .github/scripts/release_snapshot.py resolve \
              --operation "${operation}" \
              --target-sha "${SOURCE_INPUT}" \
              --github-output "$GITHUB_OUTPUT"
            enabled="$(grep '^release_enabled=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            if [ "${enabled}" != true ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "Release intent disables product publication for ${SOURCE_INPUT}"
              exit 0
            fi
            release_action="$(grep '^release_action=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            release_channel="$(grep '^release_channel=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            if [ "${operation}" = automatic ] && [ "${release_action}" = exact ]; then
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "release_reason=controlled_exact_required" >> "$GITHUB_OUTPUT"
              echo "Release intent requires workflow_dispatch operation=exact; no product version was chosen"
              exit 0
            fi
            if [ "${operation}" = exact ]; then
              test "${release_action}" = exact
              test -n "${EXACT_VERSION}"
            fi
          fi

          candidate_sha=""
          if git fetch origin refs/heads/release/product-main:refs/remotes/origin/release/product-main >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse refs/remotes/origin/release/product-main)"
          fi

          if [ "${operation}" = recover ]; then
            test -n "${SOURCE_INPUT}"
            git fetch origin "${SOURCE_INPUT}" >/dev/null 2>&1 || true
            python3 .github/scripts/release_chain.py verify-commit --commit "${SOURCE_INPUT}" --github-output "$GITHUB_OUTPUT"
            release_sha="$(grep '^releaseSha=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            if [ -n "${candidate_sha}" ] && [ "${candidate_sha}" != "${release_sha}" ]; then
              echo "release/product-main points at ${candidate_sha}, not ${release_sha}" >&2
              exit 1
            fi
            if [ -z "${candidate_sha}" ]; then
              git push origin "${release_sha}:refs/heads/release/product-main"
            fi
          elif [ "${operation}" = promote ]; then
            test "${SOURCE_INPUT}" = "${main_sha}"
            git checkout --detach "${SOURCE_INPUT}"
            promote_args=(promote --commit "${SOURCE_INPUT}" --github-output "$GITHUB_OUTPUT")
            if [ -n "${EXACT_VERSION}" ]; then promote_args+=(--exact-version "${EXACT_VERSION}"); fi
            python3 .github/scripts/release_chain.py "${promote_args[@]}"
            release_sha="$(grep '^releaseSha=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            git push origin "${release_sha}:refs/heads/release/product-main"
          else
            test "${SOURCE_INPUT}" = "${main_sha}"
            if [ -n "${candidate_sha}" ]; then
              candidate_json="$(python3 .github/scripts/release_chain.py verify-commit --commit "${candidate_sha}")"
              candidate_source="$(printf '%s' "${candidate_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
              if [ "${candidate_source}" = "${SOURCE_INPUT}" ]; then
                verify_args=(verify-commit --source-sha "${SOURCE_INPUT}" --commit "${candidate_sha}" --github-output "$GITHUB_OUTPUT")
                if [ "${operation}" = automatic ]; then
                  expected_version="$(python3 scripts/product-version.py --mode next-patch --source-sha "${SOURCE_INPUT}")"
                  verify_args+=(--version "${expected_version}")
                else
                  verify_args+=(--version "${EXACT_VERSION}")
                fi
                python3 .github/scripts/release_chain.py "${verify_args[@]}"
              elif git merge-base --is-ancestor "${candidate_sha}" "${main_sha}"; then
                git checkout --detach "${SOURCE_INPUT}"
                stage_args=(stage --source-sha "${SOURCE_INPUT}" --mode "${operation}" --github-output "$GITHUB_OUTPUT")
                if [ "${operation}" = exact ]; then
                  test -n "${EXACT_VERSION}"
                  stage_args=(stage --source-sha "${SOURCE_INPUT}" --mode exact --exact-version "${EXACT_VERSION}" --expected-channel "${release_channel}" --github-output "$GITHUB_OUTPUT")
                fi
                python3 .github/scripts/release_chain.py "${stage_args[@]}"
                release_sha="$(grep '^releaseSha=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
                git push origin "${release_sha}:refs/heads/release/product-main"
              else
                echo "release/product-main has an incomplete candidate ${candidate_sha}; recover it before releasing ${SOURCE_INPUT}" >&2
                exit 1
              fi
            else
              git checkout --detach "${SOURCE_INPUT}"
              stage_args=(stage --source-sha "${SOURCE_INPUT}" --mode "${operation}" --github-output "$GITHUB_OUTPUT")
              if [ "${operation}" = exact ]; then
                test -n "${EXACT_VERSION}"
                stage_args=(stage --source-sha "${SOURCE_INPUT}" --mode exact --exact-version "${EXACT_VERSION}" --expected-channel "${release_channel}" --github-output "$GITHUB_OUTPUT")
              fi
              python3 .github/scripts/release_chain.py "${stage_args[@]}"
              release_sha="$(grep '^releaseSha=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
              git push origin "${release_sha}:refs/heads/release/product-main"
            fi
          fi
          release_sha="$(grep '^releaseSha=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          test -n "${release_sha}"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout staged Release Commit
        if: steps.release.outputs.enabled == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.releaseSha }}
        run: git checkout --detach "${RELEASE_SHA}"

      - name: Setup Rust and Xtensa
        if: steps.release.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Setup Xtensa toolchain
        if: steps.release.outputs.enabled == 'true'
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: Setup Linux serial dependencies
        if: steps.release.outputs.enabled == 'true'
        uses: ./.github/actions/setup-linux-serial-deps

      - name: Setup Bun
        if: steps.release.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Web dependencies
        if: steps.release.outputs.enabled == 'true'
        run: bun install --cwd web --frozen-lockfile

      - name: Build and package product assets
        if: steps.release.outputs.enabled == 'true'
        env:
          FLUX_PURR_BUILD_MODE: release
          FLUX_PURR_SOURCE_SHA: ${{ steps.release.outputs.releaseSha }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          info_json="$(python3 scripts/product-version.py --mode release --source-sha "${FLUX_PURR_SOURCE_SHA}" --format json)"
          printf '%s\n' "${info_json}" > build-info.json
          channel="$(printf '%s' "${info_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["channel"])')"
          bash scripts/check-firmware-build.sh
          cargo build --manifest-path tools/flux-purr-devd/Cargo.toml --release --locked --bins
          mkdir -p release-assets
          bundle="release-assets/flux-purr-firmware-v${PRODUCT_VERSION}.fluxpurr-fw"
          target/release/flux-purr-build-firmware-bundle \
            --elf firmware/target/xtensa-esp32s3-none-elf/release/flux-purr \
            --partition-table firmware/partitions.csv \
            --version "${PRODUCT_VERSION}" \
            --source-sha "${FLUX_PURR_SOURCE_SHA}" \
            --build-id "${FLUX_PURR_SOURCE_SHA:0:16}" \
            --channel "${channel}" \
            --output "${bundle}"
          tar -czf "release-assets/flux-purr-firmware-v${PRODUCT_VERSION}.tar.gz" -C release-assets "$(basename "${bundle}")"
          python3 tools/firmware-web-catalog/build_catalog.py \
            --skip-remote \
            --output-root web/public/firmware \
            --current-bundle "${bundle}" \
            --current-tag "${PRODUCT_TAG}" \
            --current-published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bun run --cwd web build
          tar -czf "release-assets/flux-purr-web-v${PRODUCT_VERSION}.tar.gz" -C web/dist .
          mkdir -p host-tools/bin
          cp target/release/flux-purr target/release/flux-purr-devd host-tools/bin/
          cp build-info.json VERSION host-tools/
          tar -czf "release-assets/flux-purr-host-tools-linux-x64-v${PRODUCT_VERSION}.tar.gz" -C host-tools .
          cp build-info.json VERSION release-assets/
          web_component="$(CHANNEL="${channel}" python3 -c 'import json,os; print(json.dumps({"id":"web","version":os.environ["PRODUCT_VERSION"],"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.http.v1","flux-purr.web-serial.v1"],"assets":["flux-purr-web-v"+os.environ["PRODUCT_VERSION"]+".tar.gz"]}))')"
          firmware_component="$(CHANNEL="${channel}" python3 -c 'import json,os; print(json.dumps({"id":"firmware","version":os.environ["PRODUCT_VERSION"],"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.usb.v1"],"assets":["flux-purr-firmware-v"+os.environ["PRODUCT_VERSION"]+".fluxpurr-fw","flux-purr-firmware-v"+os.environ["PRODUCT_VERSION"]+".tar.gz"]}))')"
          host_component="$(CHANNEL="${channel}" python3 -c 'import json,os; print(json.dumps({"id":"host-tools","version":os.environ["PRODUCT_VERSION"],"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.devd-http.v1"],"assets":["flux-purr-host-tools-linux-x64-v"+os.environ["PRODUCT_VERSION"]+".tar.gz"]}))')"
          manifest="release-assets/flux-purr-release-manifest-${PRODUCT_TAG}.json"
          python3 .github/scripts/product_release_manifest.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --version "${PRODUCT_VERSION}" \
            --tag "${PRODUCT_TAG}" \
            --source-sha "${FLUX_PURR_SOURCE_SHA}" \
            --channel "${channel}" \
            --asset-root release-assets \
            --component "${web_component}" \
            --component "${firmware_component}" \
            --component "${host_component}" \
            --output "${manifest}"
          test "$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["version"]+" "+p["sourceSha"]+" "+p["tag"])' "${manifest}")" = "${PRODUCT_VERSION} ${FLUX_PURR_SOURCE_SHA} ${PRODUCT_TAG}"

      - name: Create or verify immutable product tag
        if: steps.release.outputs.enabled == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.releaseSha }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/${PRODUCT_TAG}"; then
            test "$(git rev-list -n1 "refs/tags/${PRODUCT_TAG}")" = "${RELEASE_SHA}"
          else
            git tag -a "${PRODUCT_TAG}" "${RELEASE_SHA}" -m "${PRODUCT_TAG}"
            git push origin "${PRODUCT_TAG}"
          fi

      - name: Publish and verify release assets
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.releaseSha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${PRODUCT_TAG}" >/dev/null 2>&1; then
            gh release upload "${PRODUCT_TAG}" release-assets/* --clobber
          else
            gh release create "${PRODUCT_TAG}" release-assets/* --verify-tag --title "${PRODUCT_TAG}" --generate-notes
          fi
          test "$(git rev-list -n1 "refs/tags/${PRODUCT_TAG}")" = "${RELEASE_SHA}"
          python3 - "${PRODUCT_TAG}" "${PRODUCT_VERSION:-}" <<'PY'
          import json
          import os
          import subprocess
          import sys

          tag, _ = sys.argv[1:]
          payload = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--json", "assets"], text=True))
          names = {item["name"] for item in payload["assets"]}
          required = {name for name in names if name.startswith("flux-purr-")}
          if not any(name.startswith("flux-purr-web-v") for name in required): raise SystemExit("missing web asset")
          if not any(name.endswith(".fluxpurr-fw") for name in required): raise SystemExit("missing firmware bundle")
          if not any(name.startswith("flux-purr-host-tools-") for name in required): raise SystemExit("missing host tools")
          if not any(name.startswith("flux-purr-release-manifest-") for name in required): raise SystemExit("missing release manifest")
          PY

      - name: Deploy published Web archive to EdgeOne
        if: steps.release.outputs.enabled == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDGEONE_API_TOKEN}" || { echo "repository secret EDGEONE_API_TOKEN is required" >&2; exit 1; }
          test -n "${EDGEONE_PROJECT_NAME}" || { echo "repository secret EDGEONE_PROJECT_NAME is required" >&2; exit 1; }
          if gh release view "${{ steps.release.outputs.tag }}" --json assets --jq '.assets[].name' | grep -Fxq .edgeone-deployed; then
            echo "EdgeOne deployment marker already exists; skip duplicate deployment"
            exit 0
          fi
          archive="release-assets/flux-purr-web-v${PRODUCT_VERSION}.tar.gz"
          test -f "${archive}"
          rm -rf web-dist
          mkdir web-dist
          tar -xzf "${archive}" -C web-dist
          npx --yes edgeone@1.6.18 makers deploy web-dist -n "${EDGEONE_PROJECT_NAME}" -e production -t "${EDGEONE_API_TOKEN}"
          printf '%s\n' "${{ steps.release.outputs.releaseSha }}" > .edgeone-deployed
          gh release upload "${{ steps.release.outputs.tag }}" .edgeone-deployed --clobber

      - name: Fast-forward main after verified publication
        if: steps.release.outputs.enabled == 'true'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.sourceSha }}
          RELEASE_SHA: ${{ steps.release.outputs.releaseSha }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          git push origin "${RELEASE_SHA}:refs/heads/main"
