name: Release Product

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: "Owner-confirmed release intent"
        required: true
        type: choice
        options: [patch, minor, major, rc]
      operation:
        description: "Create a release or retry an existing identity"
        required: true
        type: choice
        options: [publish, recover]
        default: publish

concurrency:
  group: release-product-${{ github.sha }}-${{ inputs.release_target }}-${{ inputs.operation }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release Product
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      RELEASE_OPERATION: ${{ inputs.operation }}
      RELEASE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact main release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false

      - name: Configure release controller identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve manual release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          source_sha="${RELEASE_SOURCE_SHA}"
          test "${source_sha}" = "$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse origin/main)"
          if [ "${current_main_sha}" != "${source_sha}" ]; then
            echo "main advanced after dispatch: expected ${source_sha}, observed ${current_main_sha}" >&2
            exit 1
          fi
          tag_file="${RUNNER_TEMP}/release-tags.txt"
          intent_file="${RUNNER_TEMP}/release-tag-intents.txt"
          baseline_file="${RUNNER_TEMP}/release-tag-baselines.txt"
          reservation_file="${RUNNER_TEMP}/release-tag-reservations.txt"
          : > "${tag_file}"
          : > "${intent_file}"
          : > "${baseline_file}"
          : > "${reservation_file}"
          metadata_re='^Flux-Purr-Release-Intent: (patch|minor|major|rc); Flux-Purr-Trusted-Baseline: ([0-9]+\.[0-9]+\.[0-9]+); Flux-Purr-Reservation-ID: (v[^[:space:]]+@[0-9a-f]{40})$'
          while IFS=$'\t' read -r tag _ tag_subject; do
            [ -n "${tag}" ] || continue
            printf '%s %s\n' "${tag}" "$(git rev-list -n1 "${tag}")" >> "${tag_file}"
            if [[ "${tag_subject}" =~ ${metadata_re} ]]; then
              printf '%s %s\n' "${tag}" "${BASH_REMATCH[1]}" >> "${intent_file}"
              printf '%s %s\n' "${tag}" "${BASH_REMATCH[2]}" >> "${baseline_file}"
              printf '%s %s\n' "${tag}" "${BASH_REMATCH[3]}" >> "${reservation_file}"
            fi
          done < <(git for-each-ref --format='%(refname:short)%09%(objectname)%09%(contents:subject)' 'refs/tags/v*')

          fallback_version="$(git show "${source_sha}:VERSION" | tr -d '\n')"
          baseline_json="$(python3 .github/scripts/manual_release.py baseline \
            --tags-file "${tag_file}" --source-sha "${source_sha}" \
            --fallback-version "${fallback_version}")"
          baseline_tag="$(printf '%s' "${baseline_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          baseline_version="$(printf '%s' "${baseline_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          if [ -n "${baseline_tag}" ]; then
            git diff --name-only "${baseline_tag}..${source_sha}" > "${RUNNER_TEMP}/release-paths.txt"
          else
            root_commit="$(git rev-list --max-parents=0 "${source_sha}" | tail -n1)"
            git diff --name-only "${root_commit}..${source_sha}" > "${RUNNER_TEMP}/release-paths.txt"
          fi
          classification="$(python3 .github/scripts/manual_release.py classify --paths-file "${RUNNER_TEMP}/release-paths.txt")"
          release_required="$(printf '%s' "${classification}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["release_required"]).lower())')"
          if [ "${release_required}" != true ] && [ "${RELEASE_OPERATION}" != recover ]; then
            {
              echo "enabled=false"
              echo "release_reason=document_only"
              echo "release_sha=${source_sha}"
              echo "baseline_version=${baseline_version}"
            } >> "${GITHUB_OUTPUT}"
            echo "Only documentation files changed since ${baseline_tag:-repository bootstrap}; product release skipped."
            exit 0
          fi
          if [ "${release_required}" != true ]; then
            echo "Recovery requested; continue to verify the existing release identity even though no new product paths are present."
          fi

          identity_json="$(python3 .github/scripts/manual_release.py identity \
            --intent "${RELEASE_TARGET}" --baseline "${baseline_version}" \
            --source-sha "${source_sha}" --tags-file "${tag_file}" \
            --intent-file "${intent_file}" \
            --baseline-file "${baseline_file}" \
            --reservation-file "${reservation_file}" \
            --operation "${RELEASE_OPERATION}")"
          version="$(printf '%s' "${identity_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          tag="$(printf '%s' "${identity_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          identity_baseline="$(printf '%s' "${identity_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["baseline"])')"
          reservation_id="$(printf '%s' "${identity_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reservation_id"])')"
          reservation_status="$(printf '%s' "${identity_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reservation_status"])')"
          {
            echo "enabled=true"
            echo "release_sha=${source_sha}"
            echo "source_sha=${source_sha}"
            echo "baseline_version=${identity_baseline}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "reservation_id=${reservation_id}"
            echo "reservation_status=${reservation_status}"
          } >> "${GITHUB_OUTPUT}"

      - name: Reserve immutable release tag
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARGET: ${{ env.RELEASE_TARGET }}
          BASELINE_VERSION: ${{ steps.release.outputs.baseline_version }}
          RESERVATION_ID: ${{ steps.release.outputs.reservation_id }}
        run: |
          set -euo pipefail
          git tag -a "${PRODUCT_TAG}" "${RELEASE_SHA}" \
            -m "Flux-Purr-Release-Intent: ${RELEASE_TARGET}; Flux-Purr-Trusted-Baseline: ${BASELINE_VERSION}; Flux-Purr-Reservation-ID: ${RESERVATION_ID}" \
            -m "${PRODUCT_TAG}"
          git push origin "${PRODUCT_TAG}"
          test "$(git rev-list -n1 "${PRODUCT_TAG}")" = "${RELEASE_SHA}"

      - name: Checkout release source and bind VERSION
        if: steps.release.outputs.enabled == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git checkout --detach "${RELEASE_SHA}"
          printf '%s\n' "${PRODUCT_VERSION}" > VERSION
          test "$(cat VERSION)" = "${PRODUCT_VERSION}"

      - name: Restore immutable release assets for recovery
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'recover'
        env:
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh release view "${PRODUCT_TAG}" --json tagName --jq '.tagName' | grep -Fx "${PRODUCT_TAG}"
          gh release download "${PRODUCT_TAG}" --dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -name 'flux-purr-release-manifest-*.json' -print -quit)"

      - name: Setup Rust and Xtensa
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Setup Xtensa toolchain
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: Setup Linux serial dependencies
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        uses: ./.github/actions/setup-linux-serial-deps

      - name: Setup Bun
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install Web dependencies
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        run: bun install --cwd web --frozen-lockfile

      - name: Build and package product assets
        if: steps.release.outputs.enabled == 'true' && inputs.operation == 'publish'
        env:
          FLUX_PURR_BUILD_MODE: release
          FLUX_PURR_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          info_json="$(python3 scripts/product-version.py --mode release --source-sha "${FLUX_PURR_SOURCE_SHA}" --format json)"
          printf '%s\n' "${info_json}" > build-info.json
          channel="$(printf '%s' "${info_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["channel"])')"
          bash scripts/check-firmware-build.sh
          cargo build --manifest-path tools/flux-purr-devd/Cargo.toml --release --locked --bins
          mkdir -p release-assets
          bundle="release-assets/flux-purr-firmware-v${PRODUCT_VERSION}.fluxpurr-fw"
          target/release/flux-purr-build-firmware-bundle \
            --elf firmware/target/xtensa-esp32s3-none-elf/release/flux-purr \
            --partition-table firmware/partitions.csv \
            --version "${PRODUCT_VERSION}" \
            --source-sha "${FLUX_PURR_SOURCE_SHA}" \
            --build-id "${FLUX_PURR_SOURCE_SHA:0:16}" \
            --channel "${channel}" \
            --output "${bundle}"
          tar -czf "release-assets/flux-purr-firmware-v${PRODUCT_VERSION}.tar.gz" -C release-assets "$(basename "${bundle}")"
          python3 tools/firmware-web-catalog/build_catalog.py \
            --skip-remote \
            --output-root web/public/firmware \
            --current-bundle "${bundle}" \
            --current-tag "${PRODUCT_TAG}" \
            --current-published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bun run --cwd web build
          bun run --cwd web build:demo
          tar -czf "release-assets/flux-purr-web-v${PRODUCT_VERSION}.tar.gz" -C web/dist .
          tar -czf "release-assets/flux-purr-web-demo-v${PRODUCT_VERSION}.tar.gz" -C web/dist-demo .
          mkdir -p host-tools/bin
          cp target/release/flux-purr target/release/flux-purr-devd host-tools/bin/
          cp build-info.json VERSION host-tools/
          cp web/public/firmware/firmware-integrity-catalog.json host-tools/bin/
          tar -czf "release-assets/flux-purr-host-tools-linux-x64-v${PRODUCT_VERSION}.tar.gz" -C host-tools .
          cp build-info.json VERSION release-assets/
          web_component="$(CHANNEL="${channel}" python3 -c 'import json,os; version=os.environ["PRODUCT_VERSION"]; print(json.dumps({"id":"web","version":version,"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.http.v1","flux-purr.web-serial.v1"],"assets":["flux-purr-web-v"+version+".tar.gz","flux-purr-web-demo-v"+version+".tar.gz"]}))')"
          firmware_component="$(CHANNEL="${channel}" python3 -c 'import json,os; print(json.dumps({"id":"firmware","version":os.environ["PRODUCT_VERSION"],"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.usb.v2"],"assets":["flux-purr-firmware-v"+os.environ["PRODUCT_VERSION"]+".fluxpurr-fw","flux-purr-firmware-v"+os.environ["PRODUCT_VERSION"]+".tar.gz"]}))')"
          host_component="$(CHANNEL="${channel}" python3 -c 'import json,os; print(json.dumps({"id":"host-tools","version":os.environ["PRODUCT_VERSION"],"channel":os.environ["CHANNEL"],"protocolVersions":["flux-purr.devd-local-cbor.v1","flux-purr.devd-http.v1"],"assets":["flux-purr-host-tools-linux-x64-v"+os.environ["PRODUCT_VERSION"]+".tar.gz"]}))')"
          manifest="release-assets/flux-purr-release-manifest-${PRODUCT_TAG}.json"
          python3 .github/scripts/product_release_manifest.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --version "${PRODUCT_VERSION}" \
            --tag "${PRODUCT_TAG}" \
            --source-sha "${FLUX_PURR_SOURCE_SHA}" \
            --channel "${channel}" \
            --intent "${RELEASE_TARGET}" \
            --baseline "${{ steps.release.outputs.baseline_version }}" \
            --reservation-id "${{ steps.release.outputs.reservation_id }}" \
            --asset-root release-assets \
            --component "${web_component}" \
            --component "${firmware_component}" \
            --component "${host_component}" \
            --output "${manifest}"
          test "$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print(p["version"]+" "+p["sourceSha"]+" "+p["tag"]+" "+p["releaseIntent"]+" "+p["trustedBaseline"]+" "+p["reservationId"])' "${manifest}")" = "${PRODUCT_VERSION} ${FLUX_PURR_SOURCE_SHA} ${PRODUCT_TAG} ${RELEASE_TARGET} ${{ steps.release.outputs.baseline_version }} ${{ steps.release.outputs.reservation_id }}"

      - name: Publish and verify release assets
        if: steps.release.outputs.enabled == 'true'
        env:
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TARGET: ${{ env.RELEASE_TARGET }}
          BASELINE_VERSION: ${{ steps.release.outputs.baseline_version }}
          RESERVATION_ID: ${{ steps.release.outputs.reservation_id }}
          RELEASE_OPERATION: ${{ env.RELEASE_OPERATION }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_OPERATION}" = recover ]; then
            gh release view "${PRODUCT_TAG}" --json tagName --jq '.tagName' | grep -Fx "${PRODUCT_TAG}"
          elif gh release view "${PRODUCT_TAG}" >/dev/null 2>&1; then
            echo "release ${PRODUCT_TAG} already exists; publish cannot mutate an existing identity" >&2
            exit 1
          else
            gh release create "${PRODUCT_TAG}" release-assets/* --verify-tag --title "${PRODUCT_TAG}" --generate-notes
          fi
          test "$(git rev-list -n1 "refs/tags/${PRODUCT_TAG}")" = "${RELEASE_SHA}"
          manifest="$(find release-assets -maxdepth 1 -type f -name 'flux-purr-release-manifest-*.json' -print -quit)"
          test -n "${manifest}"
          python3 .github/scripts/verify_release_assets.py \
            --asset-root release-assets \
            --manifest "$(basename "${manifest}")" \
            --version "${PRODUCT_VERSION}" \
            --tag "${PRODUCT_TAG}" \
            --source-sha "${RELEASE_SHA}" \
            --intent "${RELEASE_TARGET}" \
            --baseline "${BASELINE_VERSION}" \
            --reservation-id "${RESERVATION_ID}"

      - name: Prepare EdgeOne deployment helper
        if: steps.release.outputs.enabled == 'true'
        env:
          CONTROLLER_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          helper_path="${RUNNER_TEMP}/flux-purr-deploy-edgeone.sh"
          git show "${CONTROLLER_SHA}:.github/scripts/deploy-edgeone.sh" > "${helper_path}"
          chmod 700 "${helper_path}"
          test -x "${helper_path}"

      - name: Deploy published Web archive to EdgeOne
        if: steps.release.outputs.enabled == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDGEONE_API_TOKEN}" || { echo "repository secret EDGEONE_API_TOKEN is required" >&2; exit 1; }
          test -n "${EDGEONE_PROJECT_NAME}" || { echo "repository secret EDGEONE_PROJECT_NAME is required" >&2; exit 1; }
          marker_path="release-assets/.edgeone-deployed"
          if [ -f "${marker_path}" ]; then
            marker_sha="$(tr -d '\r\n' < "${marker_path}")"
            if [ "${marker_sha}" != "${RELEASE_SHA}" ]; then
              echo "EdgeOne deployment marker belongs to ${marker_sha}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
            echo "EdgeOne deployment marker matches this release identity; skip duplicate deployment"
            exit 0
          fi
          archive="release-assets/flux-purr-web-v${PRODUCT_VERSION}.tar.gz"
          test -f "${archive}"
          rm -rf web-dist
          mkdir web-dist
          tar -xzf "${archive}" -C web-dist
          bash "${RUNNER_TEMP}/flux-purr-deploy-edgeone.sh" web-dist "${EDGEONE_PROJECT_NAME}" web-production
          printf '%s\n' "${RELEASE_SHA}" > .edgeone-deployed
          gh release upload "${PRODUCT_TAG}" .edgeone-deployed

      - name: Deploy published public demo archive to EdgeOne
        if: steps.release.outputs.enabled == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_DEMO_PROJECT_NAME: ${{ secrets.EDGEONE_DEMO_PROJECT_NAME }}
          PRODUCT_VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EDGEONE_API_TOKEN}" || { echo "repository secret EDGEONE_API_TOKEN is required" >&2; exit 1; }
          test -n "${EDGEONE_DEMO_PROJECT_NAME}" || { echo "repository secret EDGEONE_DEMO_PROJECT_NAME is required" >&2; exit 1; }
          marker_path="release-assets/.edgeone-demo-deployed"
          if [ -f "${marker_path}" ]; then
            marker_sha="$(tr -d '\r\n' < "${marker_path}")"
            if [ "${marker_sha}" != "${RELEASE_SHA}" ]; then
              echo "EdgeOne public demo deployment marker belongs to ${marker_sha}, expected ${RELEASE_SHA}" >&2
              exit 1
            fi
            echo "EdgeOne public demo deployment marker matches this release identity; skip duplicate deployment"
            exit 0
          fi
          archive="release-assets/flux-purr-web-demo-v${PRODUCT_VERSION}.tar.gz"
          test -f "${archive}"
          rm -rf web-demo-dist
          mkdir web-demo-dist
          tar -xzf "${archive}" -C web-demo-dist
          bash "${RUNNER_TEMP}/flux-purr-deploy-edgeone.sh" web-demo-dist "${EDGEONE_DEMO_PROJECT_NAME}" web-demo-production
          printf '%s\n' "${RELEASE_SHA}" > .edgeone-demo-deployed
          gh release upload "${PRODUCT_TAG}" .edgeone-demo-deployed
