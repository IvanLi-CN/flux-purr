name: Release Product

on:
  workflow_run:
    workflows:
      - CI Main
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: "Release operation: recover a frozen snapshot or promote an RC"
        required: true
        type: choice
        options:
          - recover
          - promote
        default: recover
      commit_sha:
        description: "Commit SHA on main to recover or promote"
        required: true
        type: string

concurrency:
  group: release-product-${{ github.event.workflow_run.head_sha || inputs.commit_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_SNAPSHOT_NOTES_REF: refs/notes/release-snapshots

jobs:
  release-meta:
    name: Release Product Meta
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      enabled: ${{ steps.snapshot.outputs.release_enabled }}
      channel: ${{ steps.snapshot.outputs.release_channel }}
      effective_version: ${{ steps.snapshot.outputs.product_effective_version }}
      tag: ${{ steps.snapshot.outputs.product_tag }}
      operation: ${{ steps.operation.outputs.operation }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target commit
        id: target
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_EVENT_NAME}" = "workflow_dispatch" ]; then
            target_sha="${DISPATCH_COMMIT_SHA}"
          else
            if [ "${WORKFLOW_RUN_CONCLUSION}" != "success" ]; then
              echo "target_sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${WORKFLOW_RUN_EVENT}" != "push" ]; then
              echo "target_sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target_sha="${WORKFLOW_RUN_SHA}"
          fi
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid target SHA: ${target_sha}" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${target_sha}^{commit}"
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "Commit ${target_sha} is not contained in origin/main" >&2
            exit 1
          fi
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Resolve release operation
        id: operation
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_EVENT_NAME}" = "workflow_dispatch" ]; then
            operation="${DISPATCH_OPERATION}"
          else
            operation="automatic"
          fi
          case "${operation}" in
            automatic|recover|promote) ;;
            *) echo "Unsupported release operation: ${operation}" >&2; exit 1 ;;
          esac
          echo "operation=${operation}" >> "$GITHUB_OUTPUT"

      - name: Load release snapshot
        if: steps.target.outputs.target_sha != ''
        id: snapshot
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          python3 .github/scripts/release_snapshot.py resolve \
            --operation "${OPERATION}" \
            --target-sha "${TARGET_SHA}" \
            --notes-ref "${RELEASE_SNAPSHOT_NOTES_REF}" \
            --promotions-ref "refs/notes/release-promotions" \
            --github-output "$GITHUB_OUTPUT"

  web:
    name: Release Product Web Asset
    runs-on: ubuntu-latest
    needs: [release-meta, firmware]
    if: needs.release-meta.outputs.enabled == 'true'
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.target_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Download current firmware bundle
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: release-firmware

      - name: Stage same-origin firmware release catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCT_TAG: ${{ needs.release-meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t firmware_bundles < <(find release-firmware -type f -name '*.fluxpurr-fw' -print)
          if [ "${#firmware_bundles[@]}" -ne 1 ]; then
            echo "Expected exactly one current .fluxpurr-fw bundle." >&2
            exit 1
          fi
          python3 tools/firmware-web-catalog/build_catalog.py \
            --output-root web/public/firmware \
            --current-bundle "${firmware_bundles[0]}" \
            --current-tag "${PRODUCT_TAG}" \
            --current-published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Build web
        run: bun run --cwd web build

      - name: Package web artifact
        env:
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
        run: tar -czf "flux-purr-web-v${PRODUCT_EFFECTIVE_VERSION}.tar.gz" -C web/dist .

      - name: Upload web asset
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: flux-purr-web-v*.tar.gz

  firmware:
    name: Release Product Firmware Asset
    runs-on: ubuntu-latest
    needs: [release-meta]
    if: needs.release-meta.outputs.enabled == 'true'
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.target_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Setup Xtensa toolchain
        uses: ./.github/actions/setup-xtensa
        with:
          buildtargets: esp32s3

      - name: Build ESP32-S3 firmware
        env:
          FLUX_PURR_FIRMWARE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          FLUX_PURR_SOURCE_SHA: ${{ needs.release-meta.outputs.target_sha }}
        run: bash scripts/check-firmware-build.sh

      - name: Build deterministic firmware bundle
        env:
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          TARGET_SHA: ${{ needs.release-meta.outputs.target_sha }}
          RELEASE_CHANNEL: ${{ needs.release-meta.outputs.channel }}
          FW_ELF: firmware/target/xtensa-esp32s3-none-elf/release/flux-purr
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path tools/flux-purr-devd/Cargo.toml --release --locked \
            --bin flux-purr-build-firmware-bundle
          build_id="${TARGET_SHA:0:16}"
          target/release/flux-purr-build-firmware-bundle \
            --elf "${FW_ELF}" \
            --partition-table firmware/partitions.csv \
            --version "${PRODUCT_EFFECTIVE_VERSION}" \
            --source-sha "${TARGET_SHA}" \
            --build-id "${build_id}" \
            --channel "${RELEASE_CHANNEL}" \
            --output "flux-purr-firmware-v${PRODUCT_EFFECTIVE_VERSION}.fluxpurr-fw"

      - name: Package firmware artifact
        env:
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          FW_RELEASE_DIR: firmware/target/xtensa-esp32s3-none-elf/release
        run: tar -czf "flux-purr-firmware-v${PRODUCT_EFFECTIVE_VERSION}.tar.gz" -C "${FW_RELEASE_DIR}" .

      - name: Upload firmware asset
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            flux-purr-firmware-v*.tar.gz
            flux-purr-firmware-v*.fluxpurr-fw

  host-tools:
    name: Release Product Host Tools
    runs-on: ${{ matrix.os }}
    needs: [release-meta]
    if: needs.release-meta.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar
          - os: macos-14
            platform: macos-arm64
            archive: tar
          - os: windows-latest
            platform: windows-x64
            archive: zip
    steps:
      - name: Checkout workflow helpers
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Linux serial build dependencies
        uses: ./.github/actions/setup-linux-serial-deps

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.target_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0

      - name: Build host tools
        run: cargo build --manifest-path tools/flux-purr-devd/Cargo.toml --release --locked --bins

      - name: Package host tools
        shell: bash
        env:
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p package/bin
          if [ "${ARCHIVE}" = "zip" ]; then
            cp target/release/flux-purr.exe package/bin/
            cp target/release/flux-purr-devd.exe package/bin/
            powershell -NoProfile -Command "Compress-Archive -Path package/* -DestinationPath flux-purr-host-tools-${PLATFORM}-v${PRODUCT_EFFECTIVE_VERSION}.zip"
          else
            cp target/release/flux-purr package/bin/
            cp target/release/flux-purr-devd package/bin/
            tar -czf "flux-purr-host-tools-${PLATFORM}-v${PRODUCT_EFFECTIVE_VERSION}.tar.gz" -C package .
          fi

      - name: Upload host tools asset
        uses: actions/upload-artifact@v4
        with:
          name: release-host-tools-${{ matrix.platform }}
          path: |
            flux-purr-host-tools-*.tar.gz
            flux-purr-host-tools-*.zip

  publish:
    name: Release Product Publish
    runs-on: ubuntu-latest
    needs: [release-meta, web, firmware, host-tools]
    if: needs.release-meta.outputs.enabled == 'true'
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-meta.outputs.target_sha }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: downloaded-assets

      - name: Prepare release assets and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          PRODUCT_TAG: ${{ needs.release-meta.outputs.tag }}
          TARGET_SHA: ${{ needs.release-meta.outputs.target_sha }}
          RELEASE_CHANNEL: ${{ needs.release-meta.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets previous-manifest
          find downloaded-assets -maxdepth 3 -type f -print -exec cp {} release-assets/ \;

          previous_tag="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // ""' || true)"
          previous_arg=()
          if [ -n "${previous_tag}" ]; then
            gh release download "${previous_tag}" --pattern 'flux-purr-release-manifest-*.json' --dir previous-manifest --clobber || true
            previous_file="$(find previous-manifest -type f -name 'flux-purr-release-manifest-*.json' | head -n1 || true)"
            if [ -n "${previous_file}" ]; then
              previous_arg=(--previous-manifest "${previous_file}")
            fi
          fi

          web_component="$(python3 -c 'import glob,json,os; print(json.dumps({"id":"web","version":os.environ["PRODUCT_EFFECTIVE_VERSION"],"protocolVersions":["flux-purr.http.v1","flux-purr.web-serial.v1"],"assets":[os.path.basename(p) for p in glob.glob("release-assets/flux-purr-web-*.tar.gz")]}))')"
          firmware_component="$(python3 -c 'import glob,json,os; print(json.dumps({"id":"firmware","version":os.environ["PRODUCT_EFFECTIVE_VERSION"],"channel":os.environ["RELEASE_CHANNEL"],"protocolVersions":["flux-purr.usb.v1"],"assets":[os.path.basename(p) for p in glob.glob("release-assets/flux-purr-firmware-*")]}))')"
          host_tools_component="$(python3 -c 'import glob,json,os; print(json.dumps({"id":"host-tools","version":os.environ["PRODUCT_EFFECTIVE_VERSION"],"protocolVersions":["flux-purr.devd-http.v1"],"assets":[os.path.basename(p) for p in glob.glob("release-assets/flux-purr-host-tools-*")]}))')"

          manifest_name="flux-purr-release-manifest-${PRODUCT_TAG}.json"
          python3 .github/scripts/product_release_manifest.py \
            --version "${PRODUCT_EFFECTIVE_VERSION}" \
            --tag "${PRODUCT_TAG}" \
            --source-sha "${TARGET_SHA}" \
            --channel "${RELEASE_CHANNEL}" \
            --asset-root release-assets \
            "${previous_arg[@]}" \
            --component "${web_component}" \
            --component "${firmware_component}" \
            --component "${host_tools_component}" \
            --output "release-assets/${manifest_name}"

      - name: Verify existing release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT_TAG: ${{ needs.release-meta.outputs.tag }}
          PRODUCT_EFFECTIVE_VERSION: ${{ needs.release-meta.outputs.effective_version }}
          TARGET_SHA: ${{ needs.release-meta.outputs.target_sha }}
          RELEASE_CHANNEL: ${{ needs.release-meta.outputs.channel }}
          CURRENT_MANIFEST: release-assets/${{ format('flux-purr-release-manifest-{0}.json', needs.release-meta.outputs.tag) }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${PRODUCT_TAG}" >/dev/null; then
            exit 0
          fi
          existing_sha="$(git rev-list -n 1 "refs/tags/${PRODUCT_TAG}")"
          if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
            echo "Existing tag ${PRODUCT_TAG} points at ${existing_sha}, not ${TARGET_SHA}" >&2
            exit 1
          fi
          if ! gh release view "${PRODUCT_TAG}" --json assets >/dev/null 2>&1; then
            echo "Existing tag ${PRODUCT_TAG} has no GitHub Release yet; continue recovery"
            exit 0
          fi
          mkdir -p existing-release-manifest
          if ! gh release download "${PRODUCT_TAG}" \
            --pattern "flux-purr-release-manifest-*.json" \
            --dir existing-release-manifest --clobber; then
            echo "Existing Release ${PRODUCT_TAG} has no manifest; continue asset recovery"
            exit 0
          fi
          mapfile -t existing_manifests < <(find existing-release-manifest -type f -name 'flux-purr-release-manifest-*.json' -print)
          if [ "${#existing_manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one existing release manifest for ${PRODUCT_TAG}" >&2
            exit 1
          fi
          python3 - "${existing_manifests[0]}" "${CURRENT_MANIFEST}" "${PRODUCT_TAG}" "${PRODUCT_EFFECTIVE_VERSION}" "${TARGET_SHA}" "${RELEASE_CHANNEL}" <<'PY'
          import json
          import sys
          from pathlib import Path

          existing_path, current_path, tag, version, source_sha, channel = sys.argv[1:]
          existing = json.loads(Path(existing_path).read_text(encoding="utf-8"))
          current = json.loads(Path(current_path).read_text(encoding="utf-8"))
          for key, expected in {
              "product": "flux-purr",
              "version": version,
              "tag": tag,
              "sourceSha": source_sha,
              "channel": channel,
          }.items():
              if existing.get(key) != expected or current.get(key) != expected:
                  raise SystemExit(f"Existing release manifest identity mismatch: {key}")

          def asset_identity(component):
              return {
                  asset["name"]: {
                      key: asset.get(key)
                      for key in ("name", "size", "sha256", "mediaType", "channel")
                  }
                  for asset in component.get("assets", [])
              }

          existing_components = {
              component.get("id"): component
              for component in existing.get("components", [])
              if isinstance(component, dict)
          }
          current_components = {
              component.get("id"): component
              for component in current.get("components", [])
              if isinstance(component, dict)
          }
          if set(existing_components) != set(current_components):
              raise SystemExit("Existing release manifest component set mismatch")
          for component_id, current_component in current_components.items():
              existing_component = existing_components[component_id]
              for key in ("id", "version", "sourceSha", "protocolVersions"):
                  if existing_component.get(key) != current_component.get(key):
                      raise SystemExit(f"Existing release manifest mismatch: {component_id}.{key}")
              if asset_identity(existing_component) != asset_identity(current_component):
                  raise SystemExit(f"Existing release manifest asset mismatch: {component_id}")
          PY

      - name: Create and push product tag
        env:
          PRODUCT_TAG: ${{ needs.release-meta.outputs.tag }}
          TARGET_SHA: ${{ needs.release-meta.outputs.target_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${PRODUCT_TAG}" >/dev/null; then
            existing_sha="$(git rev-list -n 1 "refs/tags/${PRODUCT_TAG}")"
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "Tag ${PRODUCT_TAG} already points at ${existing_sha}, not ${TARGET_SHA}" >&2
              exit 1
            fi
            echo "Tag ${PRODUCT_TAG} already exists at ${TARGET_SHA}; skip"
          else
            git tag -a "${PRODUCT_TAG}" -m "${PRODUCT_TAG}"
            git push origin "${PRODUCT_TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.tag }}
          name: ${{ needs.release-meta.outputs.tag }}
          prerelease: ${{ needs.release-meta.outputs.channel == 'rc' }}
          generate_release_notes: true
          files: release-assets/*

  deploy-web:
    name: Release Product EdgeOne Web Deploy
    runs-on: ubuntu-latest
    needs: [release-meta, web, publish]
    if: needs.release-meta.outputs.enabled == 'true'
    timeout-minutes: 15
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download release web asset
        uses: actions/download-artifact@v4
        with:
          name: release-web
          path: release-web

      - name: Deploy current same-origin web bundle
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EDGEONE_API_TOKEN"
          test -n "$EDGEONE_PROJECT_NAME"
          mapfile -t web_archives < <(find release-web -type f -name 'flux-purr-web-v*.tar.gz' -print)
          if [ "${#web_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one release web archive." >&2
            exit 1
          fi
          mkdir web-dist
          tar -xzf "${web_archives[0]}" -C web-dist
          npx --yes edgeone@1.6.18 makers deploy web-dist -n "$EDGEONE_PROJECT_NAME" -e production -t "$EDGEONE_API_TOKEN"
