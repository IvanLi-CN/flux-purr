name: Setup Wasm toolchain
description: Install the pinned WebAssembly target and wasm-pack used by the Web build.

runs:
  using: composite
  steps:
    - name: Install wasm32 target
      shell: bash
      run: rustup target add wasm32-unknown-unknown

    - name: Install wasm-pack
      shell: bash
      env:
        WASM_PACK_VERSION: 0.14.0
      run: |
        set -euo pipefail
        if command -v wasm-pack >/dev/null 2>&1 && wasm-pack --version | grep -q "${WASM_PACK_VERSION}"; then
          exit 0
        fi
        cargo install wasm-pack --version "${WASM_PACK_VERSION}" --locked
