name: Setup Xtensa toolchain
description: Install checksum-pinned ESP32-S3 tools through official GitHub asset APIs.

inputs:
  version:
    description: Xtensa Rust toolchain version.
    required: false
    default: 1.95.0.0
  buildtargets:
    description: Comma-separated Espressif build targets.
    required: false
    default: esp32s3

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        XTENSA_TOOLCHAIN_VERSION: ${{ inputs.version }}
        XTENSA_BUILD_TARGETS: ${{ inputs.buildtargets }}
      run: |
        set -euo pipefail

        export_file="$RUNNER_TEMP/xtensa-exports"
        python3 "${{ github.action_path }}/toolchain.py" \
          "$XTENSA_TOOLCHAIN_VERSION" "$XTENSA_BUILD_TARGETS" "$export_file"
        source "$export_file"

        echo "$PATH" >> "$GITHUB_PATH"
        if [[ -n "${LIBCLANG_PATH:-}" ]]; then
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
        fi
        if [[ -n "${CLANG_PATH:-}" ]]; then
          echo "CLANG_PATH=${CLANG_PATH}" >> "$GITHUB_ENV"
        fi

        cargo install espflash --version 4.5.0 --locked

        # Fail setup when the Espressif toolchain cannot provide Clippy. The
        # target lint is a required check for Xtensa-only firmware sources.
        cargo +esp clippy --version
