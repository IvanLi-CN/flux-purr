name: Setup Linux serial build dependencies
description: Install the system packages required by the locked Linux serial build.

runs:
  using: composite
  steps:
    - name: Install Linux serial build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes pkg-config libudev-dev
