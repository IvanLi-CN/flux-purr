pre-commit:
  parallel: false
  commands:
    rust_fmt:
      glob: "{firmware,tools}/**/*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    commitlint:
      run: |
        set -euo pipefail
        if [ -x ./node_modules/.bin/commitlint ]; then
          ./node_modules/.bin/commitlint --edit {1}
          exit 0
        fi
        if command -v bunx >/dev/null 2>&1; then
          bunx --no-install commitlint --edit {1}
          exit 0
        fi
        if command -v npx >/dev/null 2>&1; then
          npx --no-install commitlint --edit {1}
          exit 0
        fi
        echo "commitlint is not installed. Install it or remove the commit-msg hook." >&2
        exit 1

pre-push:
  parallel: false
  commands:
    rust_style:
      run: bash scripts/check-rust-style.sh
    firmware_clippy:
      run: bash scripts/check-firmware-clippy.sh
    firmware_clippy_xtensa:
      run: bash scripts/check-firmware-clippy-xtensa.sh
    firmware_build:
      run: bash scripts/check-firmware-build.sh
    web_build:
      run: bash scripts/check-web-build.sh
    devd:
      run: bash scripts/check-devd.sh
    storybook_build:
      run: bash scripts/check-storybook-build.sh
    # Web E2E remains an explicit check and CI gate; keep it out of local pre-push.

post-checkout:
  commands:
    worktree_bootstrap:
      run: bash scripts/post-checkout-bootstrap.sh {1} {2} {3}
