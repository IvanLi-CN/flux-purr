[package]
name = "flux-purr-ram-bringup"
version = "0.1.0"
edition = "2024"
description = "Flash-free ESP32-S3 RAM bring-up image for Flux Purr hardware validation"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "flux-purr-ram-bringup"
path = "src/main.rs"

[dependencies]
heapless = "0.8.0"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "0.9.0"
embassy-time = "0.5.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.6.1"
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32s3"] }

[dev-dependencies]
serde_json = "1.0"
