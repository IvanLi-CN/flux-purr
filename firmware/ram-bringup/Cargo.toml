[package]
name = "flux-purr-ram-bringup"
version = "0.1.0"
edition = "2024"
description = "Temporary all-RAM Flux Purr board bring-up firmware"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
flux-purr-firmware = { path = "..", default-features = false, features = ["esp32s3", "pd-request-20v"] }
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
gc9d01 = { git = "https://github.com/IvanLi-CN/gc9d01-rs", rev = "6b75d9dc818be04e57932b750a7d209aaed3bd57", features = ["async", "panel_160x50"] }
heapless = "0.8.0"
nb = "1.1.0"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"] }
serde-json-core = "0.6.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
embassy-executor = "0.9.0"
embassy-futures = "0.1.2"
embassy-time = "0.5.0"
esp-alloc = "0.9.0"
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32s3"] }
static_cell = "2.1.0"

[dev-dependencies]
serde_json = "1.0"
