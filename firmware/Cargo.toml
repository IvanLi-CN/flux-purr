[package]
name = "flux-purr-firmware"
version = "0.1.0"
edition = "2024"
description = "Flux Purr firmware domain crate (ESP32-S3 display bring-up + host preview)"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flux-purr"
path = "src/bin/flux_purr.rs"

[[bin]]
name = "display_preview"
path = "src/bin/display_preview.rs"
required-features = ["host-preview"]

[[bin]]
name = "frontpanel_preview"
path = "src/bin/frontpanel_preview.rs"
required-features = ["host-preview"]

[[bin]]
name = "status_light_preview"
path = "src/bin/status_light_preview.rs"
required-features = ["host-preview"]

[features]
default = ["esp32s3", "web_serial", "net_http", "pd-request-20v"]
esp32s3 = []
esp32c3 = []
host-preview = []
frontpanel-key-test = []
web_serial = []
net_http = [
    "web_serial",
    "dep:embassy-net",
    "dep:embassy-sync",
    "dep:esp-radio",
    "dep:embedded-io-async",
    "esp-rtos/esp-radio",
]
pd-request-12v = []
pd-request-20v = []
pd-request-28v = []

[dependencies]
embassy-futures = "0.1.2"
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
gc9d01 = { git = "https://github.com/IvanLi-CN/gc9d01-rs", rev = "6b75d9dc818be04e57932b750a7d209aaed3bd57", features = ["panel_160x50"] }
heapless = "0.8.0"
micromath = "2.1.0"
nb = "1.1.0"
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde-json-core = "0.6.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
defmt = "1.0.1"
embassy-executor = "0.9.0"
embassy-time = "0.5.0"
embedded-hal-async = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
embedded-io-async = { version = "0.6.1", optional = true }
embedded-storage = "0.3.1"
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32s3", "esp-alloc"] }
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }
esp-storage = { version = "0.7.0", features = ["esp32s3"] }
embassy-net = { version = "0.7.1", default-features = false, features = ["dhcpv4", "dhcpv4-hostname", "medium-ethernet", "multicast", "tcp", "udp"], optional = true }
embassy-sync = { version = "0.7.0", optional = true }
esp-alloc = "0.9.0"
esp-radio = { version = "0.17.0", features = ["esp32s3", "smoltcp", "unstable", "wifi"], optional = true }
static_cell = "2.1.0"

[dev-dependencies]
esp-idf-part = "0.6"
pretty_assertions = "1.4.1"
serde_json = "1.0"
