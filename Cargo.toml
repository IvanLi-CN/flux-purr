[workspace]
resolver = "3"
members = [
  "firmware",
  "firmware/pd-sink-core",
  "firmware/ram-bringup",
  "firmware/ram-fan-pd",
  "firmware/ram-pd-hil",
  "tools/flux-purr-devd",
  "tools/rust-style-check",
]

[profile.release]
# esp-hal and esp-radio carry much of the Wi-Fi stack as generic code that
# monomorphises per call site. Cross-crate inlining removes the duplicated
# copies and keeps the fixed 2 MiB factory app inside its partition.
lto = "fat"

[profile.release.package.flux-purr-firmware]
opt-level = "z"
codegen-units = 1

# Dependencies default to opt-level 3, which inlines aggressively and grows the
# fixed 2 MiB factory-app image past its partition after the esp-hal and
# esp-radio upgrade. The firmware package keeps its own `opt-level = "z"`.
[profile.release.package."*"]
opt-level = "z"
