[package]
name = "flux-purr-devd"
version = "0.1.0"
edition = "2024"
description = "Native localhost daemon for Flux Purr USB/control-plane workflows"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flux-purr-devd"
path = "src/main.rs"

[[bin]]
name = "flux-purr"
path = "src/bin/flux-purr.rs"

[[bin]]
name = "flux-purr-bundle"
path = "src/bin/flux-purr-bundle.rs"

[[bin]]
name = "flux-purr-build-firmware-bundle"
path = "src/bin/flux-purr-build-firmware-bundle.rs"

[dependencies]
axum = { version = "0.8.4", features = ["json"] }
clap = { version = "4.5.53", features = ["derive"] }
esp-idf-part = "0.6"
espflash = { version = "=4.5.0", default-features = false, features = ["serialport"] }
ipnet = "2.12.0"
hex = "0.4.3"
md-5 = "0.10.6"
mdns-sd-discovery = "=0.1.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0.27"
serialport = "4.8.1"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tempfile = "3.23.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
