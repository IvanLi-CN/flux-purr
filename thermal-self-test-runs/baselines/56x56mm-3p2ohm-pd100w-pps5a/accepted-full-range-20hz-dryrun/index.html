<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flux Purr 温控 accepted 基线</title>
  <style>

    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{max-width:1460px;margin:auto;padding:24px}
    .topbar{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:18px}
    .eyebrow{font:600 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-transform:uppercase}
    h1{font-size:25px;line-height:1.2;margin:6px 0 7px}
    .subtitle{color:var(--muted);max-width:78ch}
    .meta{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--ink);font:600 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
    .meta span{white-space:nowrap} .meta b{color:var(--blue)}
    .stamp{text-align:right;color:var(--muted);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .status{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--radius);padding:14px 16px}
    .status.pass{border-left-color:var(--green)} .status-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .temp-label{font-size:20px;font-weight:700}
    .badge{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:2px 8px;color:var(--amber);background:var(--amber-bg)}
    .pass .badge{color:var(--green);background:var(--green-bg)} .status-metric{font-size:13px;color:var(--muted);margin-top:9px}
    .status-metric strong{color:var(--ink)}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:24px 0 9px}
    .section-head h2{font-size:17px;margin:0} .section-head p{margin:0;color:var(--muted);font-size:12px}
    .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
    .panel-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
    .panel-title h3{font-size:14px;margin:0} .panel-title span{font-size:12px;color:var(--muted)}
    .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .wide{grid-column:1/-1}
    .segmented{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
    .segmented button{border:0;border-right:1px solid var(--line);background:#fff;color:var(--muted);min-height:34px;padding:0 13px;font:600 13px inherit;cursor:pointer}
    .segmented button:last-child{border-right:0} .segmented button.active{background:var(--ink);color:#fff}
    .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .fact{background:#fff;padding:12px} .fact label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
    .fact strong{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace}
    .chart-wrap{height:320px;position:relative} .chart-wrap.compact{height:260px} canvas{width:100%;height:100%;display:block}
    .chart-tip{display:none;position:absolute;pointer-events:none;background:#111d24;color:#fff;border-radius:4px;padding:7px 9px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 4px 16px #0003;white-space:nowrap;z-index:5}
    .provenance{margin-top:18px;color:var(--muted);font-size:12px} .provenance code{color:var(--ink)}
    @media(max-width:900px){.shell{padding:14px}.topbar{display:block}.stamp{text-align:left;margin-top:8px}.summary,.results-grid{grid-template-columns:1fr}.wide{grid-column:auto}.facts{grid-template-columns:1fr 1fr}.chart-wrap{height:280px}}
  </style>
</head>

  function setupCanvas(id,draw){const canvas=document.querySelector('#'+id),wrap=canvas.parentElement,tip=wrap.querySelector('.chart-tip');function render(){const dpr=devicePixelRatio||1,rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);draw(c,rect.width,rect.height,views[id]||{},null,false);}canvas.onmousemove=event=>{const rect=canvas.getBoundingClientRect(),point={x:event.clientX-rect.left,y:event.clientY-rect.top};const ctx=canvas.getContext('2d');const info=draw(ctx,rect.width,rect.height,views[id]||{},point,true);if(info){tip.style.display='block';tip.style.left=Math.min(point.x+12,rect.width-220)+'px';tip.style.top=Math.max(4,point.y-60)+'px';tip.innerHTML=info;}else tip.style.display='none';};canvas.onmouseleave=()=>tip.style.display='none';canvas.onwheel=event=>{event.preventDefault();const view=views[id]||(views[id]={zoom:1,offset:0}),rect=canvas.getBoundingClientRect(),plotLeft=54,plotRight=18,plotWidth=Math.max(1,rect.width-plotLeft-plotRight),cursorRatio=Math.max(0,Math.min(1,(event.clientX-rect.left-plotLeft)/plotWidth)),oldZoom=view.zoom||1,anchor=(view.offset||0)+cursorRatio/oldZoom,factor=event.deltaY<0?1.25:0.8,newZoom=Math.max(1,Math.min(8,oldZoom*factor));view.zoom=newZoom;view.offset=Math.max(0,Math.min(1-1/newZoom,anchor-cursorRatio/newZoom));render();};new ResizeObserver(render).observe(wrap);return render;}
  function frame(c,w,h){const m={l:54,r:18,t:18,b:34},pw=w-m.l-m.r,ph=h-m.t-m.b;c.clearRect(0,0,w,h);c.font='11px ui-monospace, monospace';return{m,pw,ph};}
  function lineChart(id,seriesFactory,options={}){return setupCanvas(id,(c,w,h,view,hover,hit)=>{const {m,pw,ph}=frame(c,w,h),series=seriesFactory(),all=series.flatMap(item=>item.data).filter(point=>Number.isFinite(point.y));if(!all.length)return null;const minX=Math.min(...all.map(point=>point.x)),maxX=Math.max(...all.map(point=>point.x)),zoom=view.zoom||1,start=minX+(maxX-minX)*(view.offset||0),end=start+(maxX-minX)/zoom,visible=all.filter(point=>point.x>=start&&point.x<=end),minY=options.yMin??Math.min(...visible.map(point=>point.y)),maxY=options.yMax??Math.max(...visible.map(point=>point.y)),pad=(maxY-minY||1)*0.08,Y0=minY-pad,Y1=maxY+pad,x=value=>m.l+(value-start)/(end-start)*pw,y=value=>m.t+(Y1-value)/(Y1-Y0)*ph;if(options.context){for(const sample of options.context().filter(item=>item.t>=start&&item.t<=end)){const xx=x(sample.t);c.fillStyle=PHASE[sample.phase]??'#f5f6f7';c.globalAlpha=0.45;c.fillRect(xx,m.t,2,ph);c.globalAlpha=1;}}for(let i=0;i<=4;i++){const yy=m.t+ph*i/4;c.beginPath();c.moveTo(m.l,yy);c.lineTo(w-m.r,yy);c.strokeStyle='#e8ebed';c.stroke();const value=Y1-(Y1-Y0)*i/4;c.fillStyle='#66717a';c.fillText(fmt(value,options.decimals??1),5,yy+4);}if(options.band){const band=typeof options.band==='function'?options.band():options.band;c.fillStyle='rgba(24,121,78,.09)';c.fillRect(m.l,y(band[1]),pw,y(band[0])-y(band[1]));}let nearest=null;for(const item of series){c.beginPath();let begun=false;for(const point of item.data){if(point.x<start||point.x>end||!Number.isFinite(point.y))continue;const xx=x(point.x),yy=y(point.y);begun?c.lineTo(xx,yy):(c.moveTo(xx,yy),begun=true);if(hover){const dist=Math.abs(xx-hover.x);if(!nearest||dist<nearest.dist)nearest={...point,dist,name:item.name,color:item.color,xx,yy};}}c.strokeStyle=item.color;c.lineWidth=item.width||2;c.setLineDash(item.dash||[]);c.stroke();c.setLineDash([]);}for(let i=0;i<=5;i++){const xx=m.l+pw*i/5,val=start+(end-start)*i/5;c.fillStyle='#66717a';c.fillText(fmt(val,0)+'s',xx-10,h-10);}if(hit&&nearest&&nearest.dist<18){c.strokeStyle=nearest.color;c.beginPath();c.moveTo(nearest.xx,m.t);c.lineTo(nearest.xx,m.t+ph);c.stroke();return options.tooltip?options.tooltip(nearest):`${nearest.name}<br>${fmt(nearest.x,2)} s · ${fmt(nearest.y,options.decimals??2)}${options.unit||''}`;}return null;});}
  const temperatureRender=lineChart('temperature',()=>{const run=byTarget.get(active);return [{name:'实测温度',color:COLORS[active],data:run.samples.map(sample=>({x:sample.t,y:sample.temp,...sample}))},{name:'目标温度',color:'#182026',dash:[5,4],width:1,data:[{x:0,y:active},{x:run.samples.at(-1)?.t||0,y:active}]}];},{unit:'°C',band:()=>[active-1.5,active+1.5],context:()=>byTarget.get(active).samples,tooltip:sample=>`<strong>${sample.phase?.toUpperCase()||'SAMPLE'}</strong><br>${fmt(sample.x,2)} s · 温度 ${fmt(sample.temp,2)}°C<br>滤波 ${fmt(sample.filtered,2)}°C · 请求 ${fmt(sample.requestV,2)}V<br>电源 ${fmt(sample.sourceVoltageV,2)}V / ${fmt(sample.sourceCurrentA,2)}A / ${fmt(sample.sourcePowerW,2)}W`});
  const controlRender=lineChart('control',()=>{const run=byTarget.get(active);return [{name:'加热命令',color:'#c23b32',data:run.samples.map(sample=>({x:sample.t,y:sample.command}))},{name:'PD 请求电压×5',color:'#1261a0',data:run.samples.map(sample=>({x:sample.t,y:(sample.requestV||0)*5}))}];},{unit:'%',yMin:0,yMax:105,decimals:0});
  const sourceRender=lineChart('source',()=>{const run=byTarget.get(active);return [{name:'电压(V)',color:'#1261a0',data:run.samples.map(sample=>({x:sample.t,y:sample.sourceVoltageV})).filter(item=>item.y!=null)},{name:'电流(A)×4',color:'#157a82',data:run.samples.map(sample=>({x:sample.t,y:(sample.sourceCurrentA==null?null:sample.sourceCurrentA*4)})).filter(item=>item.y!=null)},{name:'功率(W)/4',color:'#c23b32',data:run.samples.map(sample=>({x:sample.t,y:(sample.sourcePowerW==null?null:sample.sourcePowerW/4)})).filter(item=>item.y!=null)}];},{decimals:1});
  function renderFacts(){const run=byTarget.get(active);const result=run.result||{};const analysis=result.analysis||{};const stable=result.fullSpeedToStable||{};const facts=[['运行状态',run.ok?'accepted':'failed'],['maxOvershootC',fmtMaybe(result.maxOvershootC,2,' °C')],['holdPeakToPeakC',fmtMaybe(result.holdPeakToPeakC,2,' °C')],['settleTime',stable.settleTimeMs==null?'未建立':fmtMaybe(stable.settleTimeMs/1000,3,' s')],['approachCurveMeanAbsErrorC',fmtMaybe(analysis.approachCurveMeanAbsErrorC,2,' °C')],['approachClass',analysis.approachCurveDeviationClass||'—'],['holdMedianOutputPermille',analysis.holdMedianOutputPermille==null?'—':fmt(analysis.holdMedianOutputPermille,0)+' ‰'],['holdP90OutputPermille',analysis.holdP90OutputPermille==null?'—':fmt(analysis.holdP90OutputPermille,0)+' ‰'],['approachSourceAvg',analysis.approachSource?.powerMw?.avg==null?'—':fmt(analysis.approachSource.powerMw.avg/1000,2)+' W'],['holdSourceAvg',analysis.holdSource?.powerMw?.avg==null?'—':fmt(analysis.holdSource.powerMw.avg/1000,2)+' W'],['样本数',String(run.samples.length)],['失败原因',run.failures.map(f=>f.reason||f.failureReason||f.stopReason).join('、')||'—']];document.querySelector('#facts').innerHTML=facts.map(item=>`<div class="fact"><label>${item[0]}</label><strong>${item[1]}</strong></div>`).join('');}
  function renderAll(){temperatureRender();controlRender();sourceRender();renderFacts();}
  renderAll();
